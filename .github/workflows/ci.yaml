on:
  push: {}
  pull_request: {}

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: 'stylua --check'
      shell: bash
      run: |
        cargo install --version 2.3.0 stylua --features lua52
        stylua --check . -v

  check-native-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: 'clang-format --dry-run'
      shell: bash
      run: |
        pip install clang-format==23.1.2
        git ls-files -z native/src native/tests native/tools \
          | grep -zE '\.(c|cpp|h|hpp)$' \
          | xargs -0 clang-format --dry-run --Werror

