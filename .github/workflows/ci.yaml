on:
  push: {}
  pull_request: {}

jobs:
  check-updater:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Windows PowerShell 5.1 updater tests
      shell: powershell
      run: ./helper-scripts/tests/update-tests.ps1
    - name: PowerShell 7 updater tests
      shell: pwsh
      run: ./helper-scripts/tests/update-tests.ps1

  check-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: 'stylua --check'
      shell: bash
      run: |
        cargo install --version 2.3.0 stylua --features lua52
        stylua --check . -v

  # On the version in .github/factorio-version; game-check.yaml tries each new release.
  mod-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Pinned Factorio version
      id: pin
      shell: bash
      run: echo "version=$(cat .github/factorio-version)" >> "$GITHUB_OUTPUT"
    - name: Mod tests
      uses: ./.github/actions/mod-tests
      with:
        version: ${{ steps.pin.outputs.version }}

  check-native-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: 'clang-format --dry-run'
      shell: bash
      run: |
        pip install clang-format==23.1.2
        git ls-files -z native/src native/tests native/tools \
          | grep -zE '\.(c|cpp|h|hpp)$' \
          | xargs -0 clang-format --dry-run --Werror
