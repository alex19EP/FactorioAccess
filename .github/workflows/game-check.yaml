name: Game check

# Checks the mod against the newest Factorio release: the DLL's symbols against that release's own
# factorio.exe and factorio.pdb, the in-game tests on its headless server, and the Mac port's
# offline check against its Mac build.
#
# Wube offers no webhook for a release, so an hourly poll of the releases API stands in for one and
# checks each new version once. The nightly run checks the newest version again whatever happened
# before, so a change of ours that breaks against it shows within a day. GitHub mails a failed
# scheduled run to whoever last changed the schedule below.
on:
  schedule:
    - cron: '23 * * * *'
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Factorio version to check, such as 2.1.22 (empty for the newest experimental)
        required: false

concurrency:
  group: game-check
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.latest.outputs.version }}
      check: ${{ steps.decide.outputs.check }}
    steps:
      - name: Checkout the pinned version
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/factorio-version
          sparse-checkout-cone-mode: false

      - name: Newest version
        id: latest
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$REQUESTED"
          if [ -z "$version" ]; then
            version=$(curl -fsS --retry 3 https://factorio.com/api/latest-releases | jq -r .experimental.expansion)
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a Factorio version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          pinned=$(cat .github/factorio-version)
          echo "Factorio $version; CI tests on $pinned (.github/factorio-version)" >> "$GITHUB_STEP_SUMMARY"

      # An entry in the Actions cache, holding nothing, marks a version as checked.
      - name: Checked before
        id: marker
        uses: actions/cache/restore@v6
        with:
          path: .game-checked
          key: game-checked-${{ steps.latest.outputs.version }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          HOURLY: ${{ github.event_name == 'schedule' && github.event.schedule == '23 * * * *' }}
          CHECKED: ${{ steps.marker.outputs.cache-hit == 'true' }}
        run: |
          if [ "$HOURLY" = true ] && [ "$CHECKED" = true ]; then
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "Checked before; the nightly run checks it again" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      # Marked before the check runs, so a failing version is not checked and mailed every hour.
      - name: Marker
        if: steps.marker.outputs.cache-hit != 'true'
        run: mkdir -p .game-checked && touch .game-checked/marker

      - name: Mark as checked
        if: steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .game-checked
          key: game-checked-${{ steps.latest.outputs.version }}

  symbols:
    needs: detect
    if: needs.detect.outputs.check == 'true'
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: MSVC environment
        uses: ./.github/actions/msvc

      - name: Build the symbol checker
        shell: pwsh
        run: |
          cmake -S native --preset default
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build native/build --config RelWithDebInfo --target fa_symbols_check

      # Only the Windows zip ships factorio.pdb. Its download needs a factorio.com account that owns
      # Space Age. The game is never cached or uploaded: it is not ours to share, and the caches of a
      # public repository are readable from pull requests.
      - name: Download Factorio
        shell: pwsh
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          if (-not $env:FACTORIO_USERNAME -or -not $env:FACTORIO_TOKEN) {
             throw 'Set the FACTORIO_USERNAME and FACTORIO_TOKEN repository secrets (the token is on the factorio.com profile page)'
          }
          $zip = "$env:RUNNER_TEMP\factorio.zip"
          curl.exe -fsSL --retry 3 -o $zip --get `
             --data-urlencode "username=$env:FACTORIO_USERNAME" --data-urlencode "token=$env:FACTORIO_TOKEN" `
             "https://www.factorio.com/get-download/$env:VERSION/expansion/win64-manual"
          if ($LASTEXITCODE) { throw "The download failed with curl exit code $LASTEXITCODE" }
          7z e $zip "-o$env:RUNNER_TEMP\factorio" factorio.exe factorio.pdb -r -y | Out-Null
          if ($LASTEXITCODE) { throw "7z failed with $LASTEXITCODE" }
          foreach ($file in 'factorio.exe', 'factorio.pdb') {
             if (-not (Test-Path "$env:RUNNER_TEMP\factorio\$file")) { throw "The zip has no $file" }
          }

      - name: Symbol check
        shell: pwsh
        run: |
          native/build/RelWithDebInfo/fa_symbols_check.exe "$env:RUNNER_TEMP\factorio\factorio.exe"
          exit $LASTEXITCODE

  # The Mac port's offline check (native/tools/mac): the DLL's names, virtual slots, layouts and
  # calling conventions against this release's Mac build and Windows PDB. The numbers are a report
  # while there is no Mac build of the DLL; the job fails only when a step of the check breaks.
  mac-check:
    needs: detect
    if: needs.detect.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: native

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q llvm-18 7zip
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q capstone==5.0.7 pefile==2024.8.26

      # factorio.exe and factorio.pdb from the Windows zip, the Mac binary from the .dmg. Never
      # cached or uploaded, as in the symbol check.
      - name: Download Factorio
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          FACTORIO_USERNAME: ${{ secrets.FACTORIO_USERNAME }}
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          if [ -z "$FACTORIO_USERNAME" ] || [ -z "$FACTORIO_TOKEN" ]; then
            echo "::error::Set the FACTORIO_USERNAME and FACTORIO_TOKEN repository secrets"
            exit 1
          fi
          get() {
            curl -fsSL --retry 3 -o "$2" --get \
              --data-urlencode "username=$FACTORIO_USERNAME" --data-urlencode "token=$FACTORIO_TOKEN" \
              "https://www.factorio.com/get-download/$VERSION/expansion/$1"
          }
          game="$RUNNER_TEMP/factorio"
          mkdir -p "$game/win" "$game/mac"
          get win64-manual "$RUNNER_TEMP/factorio.zip"
          unzip -q -j -o "$RUNNER_TEMP/factorio.zip" '*/bin/x64/factorio.exe' '*/bin/x64/factorio.pdb' -d "$game/win"
          rm "$RUNNER_TEMP/factorio.zip"
          get osx "$RUNNER_TEMP/factorio.dmg"
          # 7-Zip warns about the image's trailing data; the binary being there is what counts.
          7zz x -y -bso0 -bsp0 "$RUNNER_TEMP/factorio.dmg" -o"$game/mac" || true
          rm "$RUNNER_TEMP/factorio.dmg"
          mac=$(find "$game/mac" -path '*factorio.app/Contents/MacOS/factorio' -type f | head -1)
          if [ -z "$mac" ]; then
            echo "::error::The .dmg has no factorio.app/Contents/MacOS/factorio"
            exit 1
          fi
          echo "MAC_BIN=$mac" >> "$GITHUB_ENV"
          echo "WIN_DIR=$game/win" >> "$GITHUB_ENV"

      - name: Mac check
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I native/tools/mac/check.py \
            --exe "$WIN_DIR/factorio.exe" --pdb "$WIN_DIR/factorio.pdb" --mac "$MAC_BIN" \
            --src native/src --work "$RUNNER_TEMP/mac-work" --summary "$GITHUB_STEP_SUMMARY"

      # The check's own results, not the game's: the type and symbol dumps stay behind.
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-check
          path: |
            ${{ runner.temp }}/mac-work/*.log
            ${{ runner.temp }}/mac-work/*.json
          if-no-files-found: warn

  mod-tests:
    needs: detect
    if: needs.detect.outputs.check == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Mod tests
        uses: ./.github/actions/mod-tests
        with:
          version: ${{ needs.detect.outputs.version }}
