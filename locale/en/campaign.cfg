[fa]
# Factorio Access tutorial campaign, campaigns/factorio-access. Keys are written as __CONTROL__name__
# so the text names the player's own binding.

# Chapter 1, getting started
campaign-01-welcome=Welcome to the Factorio Access tutorial. Each level of this campaign is one chapter. This one teaches how the tutorial talks to you, and how to look around with the cursor. The tutorial does not cover everything the mod offers. The documentation linked from the mod's readme does.
campaign-01-windows=A window like this one stops the game until you close it with __CONTROL__confirm-message__. The tutorial uses them to explain things.
campaign-01-cursor=Factorio Access gives you a cursor, your hand in the world and the blind equivalent of the mouse. When no window is open, __CONTROL__fa-w__, __CONTROL__fa-a__, __CONTROL__fa-s__ and __CONTROL__fa-d__ move it one tile at a time, and it reads what is there.
campaign-01-goal-status=The goal is what to do next. Factorio Access reads each new goal as it appears. To hear it again, press __CONTROL__fa-c-tab__ until you reach the goal. Escape goes back to the game. Do that now, then move the cursor.
campaign-01-goal-move=Move the cursor around and listen to the ground.
campaign-01-goal-pond=There is a small pond north east of your character. Put the cursor on its water.
campaign-01-coordinates=Every tile has coordinates. X grows to the east and y grows to the south, so north is negative y. Your character started at 0, 0.
campaign-01-goal-coordinates=Hear the cursor's coordinates with __CONTROL__fa-k__.
campaign-01-goal-back=Bring the cursor back to your character with __CONTROL__fa-j__.
campaign-01-goal-chest=A wooden chest stands at __1__, __2__. Move the cursor onto it, checking where you are with __CONTROL__fa-k__.
campaign-01-distance=The cursor is often away from your character. __CONTROL__fa-s-k__ says how far the cursor is from your character and which way. __CONTROL__fa-a-k__ says the same as a distance east or west and a distance north or south.
campaign-01-goal-distance=Hear how far the chest is from your character.
campaign-01-factorio=Factorio is a game about building a factory. You win by launching a rocket. To get there you research technologies in labs, which use science packs that your factory makes.
campaign-01-organized=Each new science pack makes the factory bigger and more complex. Keep your base organized and solve each problem the same way each time, and you will find your way around it without seeing it.
campaign-01-saving=To save, open the game menu with __CONTROL__toggle-menu__ and choose Save game. The game also saves by itself every few minutes and says so.
campaign-01-end=This is the end of the chapter. Next you learn to walk your character and to let Kruise Kontrol walk for you.

# Chapter 2, walking and Kruise Kontrol
campaign-02-welcome=This chapter teaches you to move your character, walking with the arrow keys or letting Kruise Kontrol walk for you.
campaign-02-body=Your character is your body in the world, and the cursor is your hand. To build, open or take something, your character must be within about 10 tiles of the cursor. So you need to move around.
campaign-02-arrows=__CONTROL__move-up__, __CONTROL__move-left__, __CONTROL__move-down__ and __CONTROL__move-right__ walk your character while you hold them. Hold two of them to walk diagonally. The cursor stays where it is. A sound plays when you run into something, another while you slide along it, and a third when you are stuck.
campaign-02-goal-west-chest=A wooden chest stands at __1__, __2__, west of you. Put the cursor on it, then walk to it with the arrow keys until you stand next to it. __CONTROL__fa-s-k__ says how far the cursor, and so the chest, still is.
campaign-02-anchor=__CONTROL__fa-i__ anchors the cursor. An anchored cursor stays one tile ahead of your character as you walk, and speaks when something is in your way. Press __CONTROL__fa-i__ again to unanchor it. New games start unanchored, which is what you usually want.
campaign-02-goal-anchor=Anchor the cursor, then walk to the pond until the cursor says water. The pond is north east of where you started.
campaign-02-goal-unanchor=Unanchor the cursor with __CONTROL__fa-i__.
# Kruise Kontrol's control is the right mouse button first and the bracket second, and
# __CONTROL__ names only the first, so this key is written out.
campaign-02-kk=Kruise Kontrol walks for you and finds its way around what stands in the way. Put the cursor on an empty tile or a building and press Ctrl + Alt + Right bracket. It says what it is doing. Leave the keys alone while it walks. __CONTROL__toggle-driving__ cancels it.
campaign-02-kk-missing=Kruise Kontrol is not installed, so this chapter skips it. It is a separate mod, forked by the Factorio Access team, that walks, mines and builds for you.
campaign-02-kk-more=Kruise Kontrol does more than walk. On a tree, a rock or ore it mines, on a ghost it builds, and on a machine without fuel it refuels. Later chapters use these.
campaign-02-goal-kk=Another wooden chest stands at __1__, __2__, on the far side of the pond. Put the cursor on it and send Kruise Kontrol there.
campaign-02-goal-cancel=Send Kruise Kontrol to a tile at least __1__ tiles away, then cancel it with __CONTROL__toggle-driving__ before it arrives.
campaign-02-edge=The cursor cannot leave the screen. When you walk away from it, it is pulled along to the nearest tile still on the screen. An anchored cursor goes back to your character instead.
campaign-02-end=This is the end of the chapter. Next you learn the scanner, which lists what is around you and takes the cursor there.

# Chapter 3, the scanner
campaign-03-welcome=This chapter teaches the scanner. The scanner turns the map into a list of what is on it, nearest first, so that you can find things without walking the cursor over every tile.
campaign-03-levels=The list has three levels. Categories are kinds of things, such as resources or production. Subcategories are one thing in a category, such as iron ore. Entries are each of those, such as each iron ore patch. The list keeps itself up to date, and __CONTROL__fa-end__ lists everything again at once, sorted from where you stand.
campaign-03-keys=__CONTROL__fa-c-pageup__ and __CONTROL__fa-c-pagedown__ move between categories. __CONTROL__fa-pageup__ and __CONTROL__fa-pagedown__ move between subcategories, each on its nearest entry, and say where it is. These keys only read the list. The cursor stays where it is until you press __CONTROL__fa-home__, which moves it onto the entry you are on.
campaign-03-goal-rock=Rocks are among the resources, since mining them gives stone. Find the nearest rock and put the cursor on it with __CONTROL__fa-home__.
campaign-03-goal-copper=Find the copper ore and put the cursor on it.
campaign-03-entries=__CONTROL__fa-s-pageup__ and __CONTROL__fa-s-pagedown__ move between the entries of a subcategory, nearest first, and say which one of how many you are on.
campaign-03-goal-far-iron=There are two iron ore patches. Put the cursor on the far one.
campaign-03-remote=The far patch is off the screen, so the game opened remote view there, the view of the map that sighted players use to look around. Your character stays where it was. The cursor moves in remote view as it does around your character.
campaign-03-goal-return=Go back to your character with __CONTROL__toggle-map__.
campaign-03-coordinates=You can also move the cursor to coordinates. Press __CONTROL__fa-s-c__, type x and y separated by a space, and press Enter. For example, a wooden chest stands at __1__, __2__.
campaign-03-kk-missing=Kruise Kontrol is not installed, so the step that uses it with the scanner is skipped.
campaign-03-goal-coal=Find the coal with the scanner, put the cursor on it, and send Kruise Kontrol there. On ore Kruise Kontrol mines, so once it has mined some coal, cancel it with __CONTROL__toggle-driving__.
campaign-03-mined=Your character now carries some coal. Mining, by hand and by machine, comes in the next chapters.
campaign-03-directional=__CONTROL__fa-s-end__ lists only what lies the way your character faces, until the next __CONTROL__fa-end__. It helps when the nearest things are all behind you.
campaign-03-end=This is the end of the chapter, and of the Factorio Access basics. Next comes the game itself, starting with mining.

# Chapter 4, mining and crafting. The game binds mining, building and opening to a mouse button
# first and to a bracket second, and __CONTROL__ names only the first, so the bracket keys are
# written out.
campaign-04-welcome=This chapter is the game's first lesson. You mine by hand, smelt iron in a furnace you craft and build, then build your first mining drill. You start with empty hands.
campaign-04-goal-pod=A __1__ lies a few tiles north west of you. Put the cursor on it and open it with Left bracket.
campaign-04-goal-take=The window shows what it holds, and Tab moves to your inventory. Shift + Left bracket on a slot moves its stack to the other inventory. Move the iron gear wheels into your inventory.
campaign-04-goal-close=Close the window with __CONTROL__confirm-gui__.
campaign-04-backwards=That was all. Everything else you make yourself, and Factorio is best solved backwards. Start from what you want and ask what it needs, until you reach something you can do now. You want a mining drill, to mine for you. It needs iron plates and a stone furnace. Plates are iron ore smelted in a furnace, and a furnace is made of stone. So you start by mining.
campaign-04-mining=To mine, put the cursor on something and hold Right bracket. Ore must be right next to your character. Rocks, trees and buildings can be mined from as far as you can build. If you hear that you cannot reach, walk closer.
campaign-04-goal-iron=Mine 5 iron ore by hand. The scanner finds the iron ore east of you.
campaign-04-goal-stone=Mine the __1__ south west of you. A rock gives stone, enough for two furnaces.
campaign-04-crafting=__CONTROL__open-character-gui__ opens the character screen, with your inventory and the crafting list. On a recipe, Left bracket crafts one, Right bracket five, and Shift + Left bracket as many as you can. __CONTROL__fa-y__ reads what a recipe needs. Crafting takes a moment, and __CONTROL__fa-c-tab__ reaches the crafting queue, which lists what is still being crafted.
campaign-04-goal-furnace=Craft a stone furnace.
campaign-04-building=To build something, take it in hand with Left bracket on its slot in your inventory. When you close the window, it stays in your hand, at the cursor. As the cursor moves, you hear whether it can be built there. You hold a building by its top left tile, and Left bracket builds it, within about 10 tiles of your character. __CONTROL__fa-s-q__ says what is in your hand, and __CONTROL__clear-cursor__ puts it back in your inventory.
campaign-04-goal-build-furnace=Build the stone furnace near you.
campaign-04-goal-coal=Furnaces burn fuel, such as coal or wood. Mine 5 coal by hand. The scanner finds the coal west of you.
campaign-04-windows=Left bracket with an empty hand opens a building's window, as it opened the capsule. Tab moves between the building's slots and your inventory, and Shift + Left bracket moves a stack between them.
campaign-04-goal-ore=Open the furnace and put the iron ore in it.
campaign-04-goal-fuel=Now put coal in it too. It goes into the fuel slot by itself.
campaign-04-goal-plates=The furnace now smelts the ore into iron plates, a few seconds each. To take them, you need not open it. Close its window, and with an empty hand press Ctrl + Left bracket on the furnace. That takes out what it made. Take 5 iron plates.
campaign-04-goal-drill=Craft a burner mining drill. It needs 3 iron gear wheels, 3 iron plates and a stone furnace. You have 2 gear wheels, so crafting the drill first crafts the third gear wheel and the furnace, from your plates and stone.
campaign-04-quickbar=The quickbar holds the items you use most, each on a number key. To put an item on it, take the item in hand, press __CONTROL__fa-c-tab__ until you reach the quickbar, and press Enter on a slot. Escape goes back.
campaign-04-goal-quickbar=Put the burner mining drill on the quickbar.
campaign-04-goal-empty-hand=Put the drill back in your inventory with __CONTROL__clear-cursor__. It stays on the quickbar.
campaign-04-drill=A burner mining drill is 2 by 2 tiles and mines the ore under it. It drops what it mines in front of it. It faces north until you turn it with __CONTROL__rotate__ while it is in your hand. A drill on coal can be fed with its own coal.
campaign-04-goal-build-drill=Take the drill with its number key and build it on the coal.
campaign-04-goal-drill-off-ore=The drill stands where there is no ore. Mine it with Right bracket and build it on the coal.
campaign-04-goal-fuel-drill=The drill needs fuel too. Take coal in hand, and if you have none left, mine some more. With something in hand, Ctrl + Left bracket on a building puts in the whole stack, Ctrl + Right bracket half of it, and __CONTROL__drop-cursor__ one. Fuel the drill.
campaign-04-goal-wait-drill=The drill is mining. Wait for its first coal.
campaign-04-ground=The drill dropped the coal on the ground in front of it, just past the tile the cursor calls its output chute. The ground holds one item per tile, so the drill now waits. __CONTROL__pick-items__ picks up the items next to your character, and Right bracket picks up an item from as far as you can mine.
campaign-04-goal-pickup=Pick up the coal.
campaign-04-goal-chest=To catch what it mines, the drill needs a chest. Mine a tree for wood and craft a wooden chest.
campaign-04-goal-build-chest=Build the chest where the coal lay. With the chest in hand on that tile, the cursor says it works with the drill.
campaign-04-goal-chest-blocked=Something else stands where the drill drops. Mine it with Right bracket, then build the chest there.
campaign-04-goal-fill=On the drill, the cursor now says what it outputs to. Wait for coal to collect in the chest.
campaign-04-goal-empty-chest=Take everything out of the chest with Ctrl + Left bracket and an empty hand.
campaign-04-goal-rebuild=The __1__ is gone. Build it again.
campaign-04-refuel=The drill burns its fuel and stops when it runs out. Since it mines coal, feed it now and then from its own chest. Kruise Kontrol refuels it too.
campaign-04-grow=That was your first automation. The drill mines while you do other things, and the whole game grows this way. A few machines make a small build, small builds become parts of bigger ones, and late in the game the factory spans hundreds of tiles.
campaign-04-packs=Each science pack needs more of the factory than the one before. When you do not know what to do next, look at what the next science pack needs and work backwards from it. There is no single right way to build. The reward is a factory that runs well.
campaign-04-end=This is the end of the chapter. Next you learn inserters, and how to defend yourself.

# Chapter 5, inserters and defence. The bracket keys are written out, as in chapter 4.
campaign-05-welcome=This chapter is the game's second lesson. You get an abandoned mining site working again, learn inserters, defend yourself, and then grow the site. You start with some coal.
campaign-05-site=The mining site is a few tiles east of you. A burner mining drill on iron ore drops what it mines into a chest. South of the chest, robotic arms called inserters move the ore into a stone furnace, and the plates out of it into another chest. The first inserter is out of fuel.
campaign-05-inserter=An inserter picks up from the tile on one side of it and drops on the tile on the other side. On an inserter, the cursor says what it picks up from and what it drops to. It faces the side it picks up from. While the cursor is on one, you hear its hand, one click as it picks up and another as it drops.
campaign-05-goal-open=Put the cursor on the first inserter, at __1__, __2__, just south of the drill's chest, and open it with Left bracket.
campaign-05-goal-fuel=Put coal in its fuel slot, as you fuelled the furnace in the last chapter.
campaign-05-goal-close=Close the window with __CONTROL__confirm-gui__.
campaign-05-goal-rebuild-first=The first inserter is gone. Build a burner inserter at __1__, __2__ again. Left bracket with an empty hand opens a building, and Right bracket mines it.
campaign-05-goal-turn-first=The first inserter must pick up from the drill's chest and drop into the furnace. With the cursor on it, press __CONTROL__rotate__ until it faces north.
campaign-05-inserters=Inserters put items into buildings and chests and take them out. Where nothing stands, they use the ground. A burner inserter that moves fuel keeps some for itself, so one feeding coal never runs out.
campaign-05-goal-pistol=An iron chest stands a few tiles north west of you. Take everything in it.
campaign-05-goal-close-chest=Close the chest with __CONTROL__confirm-gui__.
campaign-05-weapons=The pistol went into your gun slot and the magazines into your ammo slot by themselves. Those slots are on the toolbar beside the quickbar. To check them, press __CONTROL__fa-c-tab__ until you reach the quickbar, then Tab past its bars and page buttons. Each gun sits above its ammo.
campaign-05-goal-equip=Put the pistol in a gun slot and the magazines in an ammo slot. Take each in hand, reach the toolbar, and press Enter on its slot.
campaign-05-footsteps=What was that? It sounded like footsteps, coming from the north.
campaign-05-shooting=To shoot, hold __CONTROL__shoot-enemy__. You shoot the enemy nearest the cursor, as far as your pistol reaches, about 15 tiles. So keep the cursor on your character, __CONTROL__fa-j__ brings it there. Enemies make a clicking sound where they are.
campaign-05-goal-fight=Kill the biters before they get you, __1__ left. Hold __CONTROL__shoot-enemy__ with the cursor on your character.
campaign-05-died=You died, and after a few seconds came back to life where you started, without what you carried. The iron chest north west of you holds a new pistol and magazines. Take them and try again.
campaign-05-after-fight=They are dead, but more might come. Time to get the site working and prepare.
campaign-05-reversed=The second inserter, south of the furnace, is turned the wrong way. It picks up from the chest south of it and drops into the furnace.
campaign-05-goal-rotate=Put the cursor on the second inserter, at __1__, __2__, and press __CONTROL__rotate__ until it faces north, toward the furnace. Each press turns it a quarter and says where it faces.
campaign-05-goal-fuel-second=Fuel it too. If you have no coal left, mine some at the coal patch south of you.
campaign-05-goal-rebuild-second=The second inserter is gone. Build a burner inserter at __1__, __2__ again.
campaign-05-goal-plate=Wait for the first iron plate in the chest south of the second inserter.
campaign-05-turning=__CONTROL__rotate__ also turns a building in your hand before you build it. With an inserter in hand, the cursor says where it will pick up and drop.
campaign-05-direct=A drill drops what it mines into whatever stands at its output, a furnace too. Build a furnace at the output of a drill on iron ore, and the drill feeds it without an inserter. Stone, copper and coal lie south and west of you.
campaign-05-goal-machines=Build more machines. Burner mining drills, __1__ of 10. Stone furnaces, __2__ of 5.
campaign-05-stone=Mining stone by hand is slow. A burner mining drill on the stone mines it for you.
campaign-05-goal-resources=Gather resources in your inventory. Iron plates, __1__ of 150. Copper plates, __2__ of 50. Coal, __3__ of 75.
campaign-05-done=That was hard work, but you have everything you need now.
campaign-05-end=This is the end of the chapter. Next you build a steam power plant and electric mining drills.

# Chapter 6, power plant. Counts come first in goals that change, since each change is spoken.
campaign-06-welcome=This chapter is the game's third lesson. You get a steam power plant working, power an electric mining drill, put a belt to work, and build radars to look for your crashed ship. Biters leave you alone in this chapter.
campaign-06-ship=The ship you crashed in lies somewhere near, with equipment you could use. Radars could find it, but radars need electricity.
campaign-06-plant=A power plant stands about 20 tiles east of you, on the south shore of a lake. A boiler burns fuel to turn water into steam, and the steam engine south of it turns steam into electricity. Further east, an electric mining drill stands on coal, with a chest at its output. Nothing is connected yet.
campaign-06-pump=Water comes from an offshore pump, built on land at the edge of the water. The game turns it to face the water itself. With a pump in hand, the scanner's Build spots category lists the places near your character where it fits, nearest first. Reach the category with __CONTROL__fa-c-pageup__ and __CONTROL__fa-c-pagedown__, and __CONTROL__fa-home__ puts the cursor on the spot.
campaign-06-goal-pump=Craft an offshore pump and build it at the lake, near the boiler.
campaign-06-pipes=Pipes carry fluids, and a pipe joins whatever next to it takes fluid. On the boiler, the engine and pipes, the cursor says where fluid goes in and out. Water to the West means a pipe on the tile west of it joins there. To build a line of pipes, hold Left bracket and move the cursor.
campaign-06-goal-water=Craft pipes and connect the pump to one of the boiler's water connections, at the west and east ends of its north side.
campaign-06-goal-rebuild=The __1__ is gone. Build it again.
campaign-06-goal-fuel=Put coal in the boiler.
campaign-06-goal-steam=Connect the boiler's steam output, in the middle of its south side, to the steam engine below it.
campaign-06-goal-refuel=The boiler is out of fuel, so nothing has power. Put coal in it from the drill's chest east of the plant.
campaign-06-electricity=Good, the steam engine now makes electricity.
campaign-06-poles=Electric poles carry electricity. A small electric pole powers every building that reaches into the 5 by 5 square around it, and wires itself to other poles up to 7 tiles away. With a pole in hand, the cursor says which poles it would wire to and what it would cover. With any electric building in hand, it says which poles would power it. You carry 10 small electric poles.
campaign-06-goal-power=Power the electric mining drill on the coal, east of the engine, with a line of small electric poles from the engine.
campaign-06-coal=The drill fills its chest with coal. The boiler burns coal all the time, and the power stops when it runs out, so keep it fed from that chest.
campaign-06-belts=Transport belts move items the way they face, and need no power. An electric mining drill is 3 by 3 tiles, mines the 5 by 5 square around it, and drops in front of it, onto a belt as well as into a chest. Hold Left bracket and move the cursor to build a line of belts, and press __CONTROL__rotate__ while holding to turn at the next step. On a belt, the cursor says where it faces, its shape, such as start, end or a turn, and what it carries. Only inserters take items off a belt.
campaign-06-goal-belt=Build an electric mining drill on the iron ore south east of the plant, a belt from its output, and an inserter that takes the ore off the belt into a stone furnace. Power the drill and the inserter with poles, and fuel the furnace.
campaign-06-radars=Now for the radars. Each needs iron plates, iron gear wheels and electronic circuits, made of copper cable. Electric drills mine much faster than burner drills. The assembling machine, now in your crafting list, crafts for you while it has power.
campaign-06-goal-radars=__1__ of 3 radars built and powered. Gather resources and build them in reach of your poles. With a radar in hand, the cursor says no power where no pole would reach it.
campaign-06-radar-1=A radar scans the land around it, one sector at a time. The more radars, the faster it goes.
campaign-06-radar-2=Radars use a lot of electricity. One steam engine cannot power three of them and your drills too.
campaign-06-engines=One boiler makes steam for two steam engines. A steam engine passes steam on from its other end, so a second engine built straight south of the first joins it. Its electricity reaches your network through a pole, like any other building's. With the engine in hand, the cursor says no power where no pole would reach it.
campaign-06-goal-engine=Craft a steam engine, build it straight south of the first, and put a pole by it, so that both power your network.
campaign-06-network=Left bracket on an electric pole opens a window about its whole network. It says how much electricity each kind of building makes and uses.
campaign-06-turrets=Biters leave you alone here, but in a normal game they attack, and radars draw them. Gun turrets, now in your crafting list, shoot them for you while they hold magazines.
campaign-06-repair=A repair pack, now in your crafting list, mends a damaged building. Take one in hand and hold Left bracket on the building.
campaign-06-submachine-gun=The pistol is weak. The submachine gun, now in your crafting list, fires much faster. With more than one gun, __CONTROL__next-weapon__ switches to the next one that has ammo.
campaign-06-goal-scan=__1__ of 20 sectors scanned. More radars, and enough power for them, make it faster.
campaign-06-scanned=Sector scan complete.
campaign-06-wreck=The radars found a small shipwreck to the south east.
campaign-06-end=This is the end of the chapter. Next you research with labs.

campaign-07-welcome=This chapter is the game's fourth lesson, and a long one. You research with labs and build the factory that research needs, all the way to a car. Biters leave you alone. Save now and then from the game menu, __CONTROL__toggle-menu__.
campaign-07-beacon=Your radars have picked up a distress beacon, but its signal is very weak. The source must be over 200 kilometres away, too far to walk. A car would get you there, and a car takes research.
campaign-07-plant=The power plant from the last chapter stands about 20 tiles east of you, running: an offshore pump, a boiler, and two steam engines south of the boiler. East of the plant, an electric mining drill on coal drops its coal onto the ground. South of the plant, four drills on iron ore drop into stone furnaces, and two more on copper ore, further west, do the same. The boiler has coal for a few minutes only.
campaign-07-drag=A belt from the coal drill to the boiler keeps the plant running for good. Hold Left bracket and move the cursor to build a line of belts, and press __CONTROL__rotate__ while holding to turn at the next step. To build while you walk, press __CONTROL__fa-i__ so the cursor stays in front of your character, then hold Left bracket and walk.
campaign-07-ruler=The audio ruler helps you line things up. __CONTROL__fa-ca-b__ puts the ruler tool in your hand, and Left bracket places a ruler on the cursor's tile. Its lines run north, south, east and west, and a tone plays when the cursor or your character comes into line with one. Cursor skipping stops on its lines. Shift + Left bracket on a line removes its ruler.
campaign-07-goal-coal=Build a belt from where the coal drill drops its coal to the boiler, and an inserter that puts the coal from the belt into the boiler. A pole powers the inserter.
campaign-07-goal-refuel=The boiler is out of fuel, so nothing has power. Put coal in it by hand.
campaign-07-research=Research unlocks new recipes and improves what you have. It happens in labs, which use up science packs. The lab is in your crafting list.
campaign-07-goal-lab=Craft a lab, build it, and power it with poles.
campaign-07-labs-1=Labs use up science packs to research the technology you choose.
campaign-07-labs-2=Each technology needs a number of science packs. More labs research faster, as long as each has packs.
campaign-07-technologies=__CONTROL__open-technology-gui__ opens the technology screen. Tab moves between its parts: the research queue, the list of technologies, the selected technology's details, and a graph of what leads to what. Enter on a technology selects it, and the Start research button in its details starts it. Red science packs, called automation science packs, take a copper plate and an iron gear wheel each. Put them in the lab like fuel, with Ctrl + Left bracket.
campaign-07-goal-wall=Research stone wall. It takes 10 red science packs.
campaign-07-car-1=Research works. The car is a long way off: automobilism needs steel, engines and green science packs first, and those need research of their own. Hundreds of science packs in all.
campaign-07-car-2=Crafting hundreds of packs by hand would take hours. Assembling machines craft for you, and an inserter can feed one machine from another.
campaign-07-assemblers=You now have a blueprint of 2 assembling machines and a lab, in a row with inserters and poles between them. The first machine makes iron gear wheels, the second makes red packs from those gears and copper plates, and the lab gets the packs. Right bracket on the blueprint in your inventory opens its window. Its preview is the blueprint's picture: the arrows move through it a tile at a time, and each tile says what the blueprint puts there.
campaign-07-place=Take the blueprint from your inventory into your hand. Its top left corner goes on the cursor, and the cursor says what stands in its way, if anything. Left bracket places it as ghosts, the plans of buildings to come. __CONTROL__rotate__ turns it.
campaign-07-detach=With a blueprint in hand, __CONTROL__fa-i__ pins it where it is and frees the cursor. Move the cursor over it to hear what each tile gets and whether it fits. Ctrl with W, A, S or D moves the pinned blueprint by a tile, and Left bracket places it at the pin. __CONTROL__fa-i__ again brings the cursor back to it.
campaign-07-ghosts=Kruise Kontrol builds ghosts for you: Ctrl + Alt + Right bracket on a ghost builds every ghost nearby, crafting what it needs from your inventory. Without Kruise Kontrol, take the building in hand and press Left bracket on its ghost. Then connect the poles to your network, and put iron plates in the gear machine and copper plates in the pack machine with Ctrl + Left bracket.
campaign-07-goal-red=Build the blueprint, power it, and give it plates, so that its lab gets red packs made from the first machine's gears.
campaign-07-copy=One lab is slow. Copy what you built instead of building it again. Ctrl + C gives the copy tool: Left bracket on one corner and Left bracket on the opposite corner puts everything between them in your hand. With something in hand, Ctrl with W, A, S or D moves the cursor by its width or height, so copies line up side by side. Ctrl + V brings back what you copied last.
campaign-07-goal-labs=__1__ of 3 labs get red packs from their own machines. Copy the setup, place copies, build them, and connect their poles.
campaign-07-smelting=All these machines eat plates faster than your furnaces make them. A smelting column takes ore and coal from belts and puts plates on another belt. You now have two blueprints for one. The tileable smelter is a furnace and its inserters, with two belts going north on its west side, one for ore and one for coal, and a belt going south on its east side for the plates. Copies placed one above another join their belts. The 4 drills blueprint puts the ore of 4 electric mining drills on one belt.
campaign-07-long-inserter=The smelter feeds its furnace with a long-handed inserter as well as an inserter. A long-handed inserter takes from 2 tiles behind it and puts 2 tiles ahead, over whatever stands between, so it reaches the far belt.
campaign-07-goal-smelter=__1__ of 8 furnaces fed from belts have smelted. Build smelting columns, with belts of ore and coal from your drills.
campaign-07-goal-plates=Run the iron plate belt to a gear machine, with an inserter feeding the machine from the belt.
campaign-07-goal-logistics=Research logistics, for underground belts and splitters.
campaign-07-belts=You now have a blueprint book of belt examples: a belt crossing under another, two belts merging, a splitter, a belt fed from both sides, and a turn that becomes a side load instead. Right bracket on the book in your inventory opens it.
campaign-07-underground=An underground belt carries items under whatever stands in the way. Build one where the belt goes down, then another up to 4 tiles further on, facing the same way, and it becomes the exit.
campaign-07-goal-underground=Build an underground belt entrance and its exit.
campaign-07-splitter=A splitter is 2 tiles wide. It takes up to 2 belts in behind it and shares their items between 2 belts out in front of it. A belt that ends against the side of another belt puts its items on that belt's near lane. That is a side load.
campaign-07-goal-splitter=Build a splitter with a belt going into it and two belts coming out of it.
campaign-07-goal-green-research=Research logistic science pack.
campaign-07-green=Green science packs, called logistic science packs, take an inserter and a transport belt each. From now on labs need red and green packs together. A machine making green packs needs machines making inserters and belts, and those need iron gear wheels and electronic circuits, made of copper cable. An inserter also passes packs from one lab to the lab next to it.
campaign-07-goal-green=Build machines that make green packs, and feed the packs into your labs with inserters.
campaign-07-low-power=Some machines run slowly, because the plant makes too little electricity. You now have a blueprint of a bigger power block: 2 boilers and 4 steam engines, with poles. A boiler passes water on to the boiler next to it, so one pump feeds them all. Left bracket on a pole tells how much electricity your network makes and uses.
campaign-07-car-3=Now the long research, automobilism. It needs logistics 2 and engine first, and engine needs steel processing. A technology can be started only once all it needs is researched, but the queue takes several that can. On the technology screen's graph, Up goes to what a technology needs. A furnace smelts 5 iron plates into a steel plate.
campaign-07-goal-automobilism=Research automobilism. Keep your labs fed with red and green packs.
campaign-07-engines=A car takes 8 engine units, 20 iron plates and 5 steel plates. Engine units are made only in an assembling machine, not by hand: set a machine to engine units and give it steel plates, iron gear wheels and pipes.
campaign-07-goal-car=Craft a car and build it.
campaign-07-driving=__CONTROL__toggle-driving__ gets in and out of the car. __CONTROL__move-up__ speeds up, __CONTROL__move-down__ brakes and then reverses, and __CONTROL__move-left__ and __CONTROL__move-right__ steer. __CONTROL__fa-k__ says where the car heads and how fast. The car burns fuel: put coal in it with Ctrl + Left bracket. Kruise Kontrol drives it too, to the tile under the cursor.
campaign-07-goal-drive=__1__ of 200 tiles driven. Fuel the car, get in, and drive.
campaign-07-enough=That is enough joyriding. Time to pack for the trip, as nobody knows what waits at the beacon.
campaign-07-goal-pack=__1__ still to pack. Put them in the car's trunk.
campaign-07-item=__1__ __2__
campaign-07-goal-rebuild=The __1__ is gone. Build it again.
campaign-07-go=That should be everything. Let's go.
campaign-07-end=This is the end of the chapter.

; Chapter 8, trains (campaigns/factorio-access/level-08).
campaign-08-welcome=This chapter is the game's fifth and last lesson. The beacon led to a base that biters wrecked. Its engineers got away, but the base is in pieces, and so is the railway to its iron mine. You repair the base, research trains, mend the railway and set up a train that brings ore on its own. Biters live nearby, but they attack only when attacked.
campaign-08-car=Your car stands beside you with what you packed. Its trunk is a good store while you work, and the car is the quick way along the railway later.
campaign-08-wreck=Where a building was destroyed, its remnants lie on the ground. On the remnants of the power plant and the factory stand ghosts, the plans of the buildings that were there. Walls, turrets and lamps are remnants only. The scanner lists ghosts and remnants in categories of their own.
campaign-08-rebuild=Ghosts are built as in the last chapter: Kruise Kontrol with Ctrl + Alt + Right bracket on a ghost builds the ghosts nearby from your inventory, or take the building in hand and press Left bracket on its ghost. Craft what you lack. Assemblers come back without a recipe, so set one in each.
campaign-08-goal-power=Rebuild the power plant, about 60 tiles north east of where you started, and the pole that joins it to the base. __1__ of its __plural_for_parameter__1__{1=building is|rest=buildings are}__ still ghosts.
campaign-08-goal-refuel=The power plant's boilers are out of fuel. Put coal in them.
campaign-08-science=Power is back. Now rebuild the labs and the science assemblers, or build new ones from what you carry: 10 assemblers and 5 labs. The furnaces that still stand make plates.
campaign-08-goal-railway-research=Research railway. It takes red and green science packs.
campaign-08-rails=Railway unlocks rails, locomotives and cargo wagons. A rail takes a steel plate, a stone and an iron stick, and makes two. The railway needs a few hundred.
campaign-08-line=The railway starts at the stop beside the base, Iron ore processing, and runs about 400 tiles west to the Iron ore mine. Biters broke it in several places. Rail remnants lie in each gap, so the scanner's remnants lead you to them. The car takes you along the line.
campaign-08-planner=To lay rails, take rails in hand, put the cursor on a rail near its end and press Left bracket. That starts the rail planner. Then move the cursor where the track should go: the planner says how many rails the route takes, which way it ends, and joins rail when it meets another track. __CONTROL__fa-k__ reads the route turn by turn. Left bracket builds it, and planning goes on from its end. The planner says out of reach when the end is too far to build. __CONTROL__clear-cursor__ ends planning.
campaign-08-goal-railway=Mend the railway, so that a train can go from Iron ore processing to the Iron ore mine and back.
campaign-08-goal-automated=Research automated rail transportation. Trains need it to drive themselves.
campaign-08-rolling-stock=A train is locomotives and wagons on rails. A locomotive only pulls forward, and this railway ends at each stop, with no loop to turn around in. So the train needs two locomotives, one at each end, facing away from each other. A locomotive takes 20 engine units, 10 electronic circuits and 30 steel plates. A cargo wagon takes 10 iron gear wheels, 20 iron plates and 20 steel plates. Engine units are made only in an assembling machine.
campaign-08-place-train=Put the cursor on a straight rail of the long line and press Left bracket with a locomotive in hand. __CONTROL__rotate__ turns it. Place the cargo wagon on the rail right behind it, then the second locomotive behind the wagon, turned the other way. Each joins the train.
campaign-08-goal-train=Build a train: a locomotive at each end, facing away from each other, and a cargo wagon between them.
campaign-08-goal-fuel=Give the locomotives fuel, as you fuel a furnace: coal in hand, Ctrl + Left bracket on each locomotive.
campaign-08-schedule=A train drives itself by its schedule: a list of stops, and how long to wait at each. Open the locomotive with Left bracket. In its schedule, add the Iron ore mine, to wait until the cargo is full, and Iron ore processing, to wait until the cargo is empty. Then switch the train from manual to automatic.
campaign-08-goal-delivery=Have the train bring a load of iron ore from the mine to Iron ore processing on its own.
campaign-08-goal-rebuild=The __1__ is gone. Build it again.
campaign-08-delivered=The ore arrives by itself now, and the inserters at Iron ore processing unload it for the furnaces. The train keeps going back and forth as long as it has fuel.
campaign-08-supplies-1=The base runs again. But biters surround it, and a new base somewhere safer is the next step. Before you go, fill the car with what a new base needs.
campaign-08-supplies-2=Solar panels need solar energy research, and piercing rounds need military 2. Both take red and green science packs.
campaign-08-goal-supplies=__1__ still to pack. Put them in the car's trunk.
campaign-08-item=__1__ __2__
campaign-08-ready=That is everything. Time to go.
campaign-08-end=This is the end of the chapter, and of the game's lessons. You can keep playing on this map.
campaign-08-final-title=Tutorial complete
campaign-08-final-text=You have played through the game's lessons with Factorio Access. You can keep playing on this map, or start a new game in freeplay, the main way to play: you start with little and build up to launching a rocket.
