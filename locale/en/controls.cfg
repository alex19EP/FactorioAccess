[control-keys]
]=Right Bracket
^=Caret
left-bracket=Left Bracket
ğ=Soft G

[controls]
fa-ca-b=Audio ruler (Ctrl+Alt+B)
fa-cs-rightbracket=Kruise Kontrol walk to the cursor (Ctrl+Shift+Right Bracket)
fa-cas-i=Toggle inserter sonification (Ctrl+Alt+Shift+I)
fa-cas-c=Toggle crafting sonification (Ctrl+Alt+Shift+C)
fa-cas-e=Toggle enemy sonification (Ctrl+Alt+Shift+E)
fa-cas-s=Toggle spawner sonification (Ctrl+Alt+Shift+S)
fa-cs-i=Toggle combat mode (Ctrl+Shift+I)
fa-c-r=Toggle strongest/closest aim (Ctrl+R)
fa-s-r=Toggle spawners first aim (Shift+R)
fa-cs-r=Toggle safe mode aim (Ctrl+Shift+R)
fa-y=Read what the cursor points at (Y)
fa-s-f=Cycle through what is on the cursor's tile (Shift+F)
fa-s-y=Read the item in hand (Shift+Y)
fa-j=Return cursor (J)
fa-t=Time of day (T)
fa-w=Cursor up (W)
fa-a=Cursor left (A)
fa-s=Cursor down (S)
fa-d=Cursor right (D)
fa-s-w=Skip cursor up, or throw capsule north in combat mode (Shift+W)
fa-s-a=Skip cursor left, or throw capsule west in combat mode (Shift+A)
fa-s-s=Skip cursor down, or throw capsule south in combat mode (Shift+S)
fa-s-d=Skip cursor right, or throw capsule east in combat mode (Shift+D)
fa-c-w=Move cursor up by the building's size (Ctrl+W)
fa-c-a=Move cursor left by the building's size (Ctrl+A)
fa-c-s=Move cursor down by the building's size (Ctrl+S)
fa-c-d=Move cursor right by the building's size (Ctrl+D)
fa-cs-w=Throw capsule north even in safe mode (Ctrl+Shift+W)
fa-cs-a=Throw capsule west even in safe mode (Ctrl+Shift+A)
fa-cs-s=Throw capsule south even in safe mode (Ctrl+Shift+S)
fa-cs-d=Throw capsule east even in safe mode (Ctrl+Shift+D)
fa-i=Detach cursor from the build in hand, or anchor it to the character (I)
fa-a-j=Read character coordinates (Alt+J)
fa-s-q=Read what is in hand (Shift+Q)
fa-cas-v=Toggle vanilla mode (Ctrl+Alt+Shift+V)
fa-end=Refresh the scan (End)
fa-s-end=Refresh the scan in the direction the character faces (Shift+End)
fa-c-pageup=Previous scanner category (Ctrl+Page Up)
fa-c-pagedown=Next scanner category (Ctrl+Page Down)
fa-pageup=Previous scanner subcategory (Page Up)
fa-pagedown=Next scanner subcategory (Page Down)
fa-s-pageup=Previous scanner entry (Shift+Page Up)
fa-s-pagedown=Next scanner entry (Shift+Page Down)
fa-home=Move cursor to the scanner entry (Home)
fa-k=Read coordinates (K)
fa-s-k=Read distance and direction from the character (Shift+K)
fa-a-k=Read distance east or west and north or south of the character (Alt+K)
fa-c-tab=Next section or screen part (Ctrl+Tab)
fa-cs-tab=Previous section or screen part (Ctrl+Shift+Tab)
