[fa]
# Entity runtime status and state messages
# This file contains messages about the current status of entities,
# including their operational state, health, and temporary conditions.
# For fixed entity properties, see entity-info.cfg

# General entity status
ent-status-full-health=full health
ent-status-percent-health=__1__ percent health

# Entity part descriptions for multi-tile entities
entity-part-center=center
entity-part-west-edge=west edge
entity-part-east-edge=east edge
entity-part-middle=middle
entity-part-south-edge=south edge
entity-part-southwest-corner=southwest corner
entity-part-southeast-corner=southeast corner
entity-part-south-tip=south tip
entity-part-north-edge=north edge
entity-part-northwest-corner=northwest corner
entity-part-northeast-corner=northeast corner
entity-part-north-tip=north tip
entity-part-west-tip=west tip
entity-part-east-tip=east tip
entity-part-all=single tile
entity-part-unknown=unknown location

# Splitter status
splitter-info-input-balanced=input balanced
splitter-info-input-priority-right=input priority right which is __1__
splitter-info-input-priority-left=input priority left which is __1__
splitter-info-output-balanced=output balanced
splitter-info-output-priority-right=output priority right which is __1__
splitter-info-output-priority-left=output priority left which is __1__
splitter-info-output-filtering=output filtering __1__ to the __2__ which is __3__

# Inserter filters
inserter-filter-set=Filter set to __1__
inserter-filter-cleared=Filter cleared

# Power switch status
power-switch-on=on
power-switch-off=off
power-switch-left-only=left electric network __1__
power-switch-right-only=right electric network __1__
power-switch-both=left electric network __1__ right __2__
