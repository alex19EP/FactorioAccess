[fa]
# Titles of the views read with a pipe's, a storage tank's or a pump's window.
fluid-views-connections=Connections
fluid-views-pipeline=Pipeline

# A connection on a side longer than a tile, by the end of the side it is at: north at west end.
fluid-views-side-at-end=__1__ at __2__ end
# How many tiles an underground connection passes under.
fluid-views-underground=underground __1__ __plural_for_parameter__1__{1=tile|rest=tiles}__
fluid-views-underground-not-connected=underground not connected
fluid-views-not-connected=not connected
# A one-way connection: fluid only comes in through it, or only goes out.
fluid-views-flow-in=in
fluid-views-flow-out=out
fluid-views-no-connections=no connections

# The pipes and pipes to ground of the pipeline, and the box around all of it.
fluid-views-extent=__1__ __plural_for_parameter__1__{1=pipe|rest=pipes}__, spans __2__ by __3__ tiles
# A building the pipeline reaches, how many of it, and what it does with the fluid.
fluid-views-building=__1__ __2__, __3__
fluid-views-flow-takes=takes
fluid-views-flow-feeds=feeds
fluid-views-flow-both=both ways
fluid-views-no-buildings=no buildings
fluid-views-incomplete=more not counted
