[mod-setting-description]
fa-inserter-sonification=Play tones when inserters pick up or drop off items while hovering over them
fa-crafting-sonification=Play tones when crafting machines in view complete products
fa-combat-enemy-sonification=Play spatial audio for nearby enemy units and turrets, pitch indicates health
fa-combat-spawner-sonification=Play spatial audio pings for nearby enemy spawners
fa-access-radar=Add the access radar, a radar that scans farther and faster for more power, craftable from the start in every game. Turning it off removes access radars from saves that have them.

[fa]
# A setting toggled by its key; __1__ is the setting's name
setting-enabled=Enabled __1__
setting-disabled=Disabled __1__
