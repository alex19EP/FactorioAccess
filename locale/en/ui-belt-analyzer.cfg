[fa]
# Titles of the views read with a belt's window.
ui-belt-analyzer-tab-local=This Belt
ui-belt-analyzer-tab-total=Total Lanes
ui-belt-analyzer-tab-upstream=Upstream Lanes
ui-belt-analyzer-tab-downstream=Downstream Lanes
# The one view read with a splitter's or a loader's window.
ui-belt-analyzer-tab-splitter=This Splitter
ui-belt-analyzer-tab-loader=This Loader

# Each view has a column per lane, named by the side it is on.
ui-belt-analyzer-lane=__1__ lane
# A splitter's lanes: the side of its two belts, then the side of that belt's two lanes.
ui-belt-analyzer-splitter-lane=__1__ belt __2__ lane
# Up to 4, for each side of a belt.
ui-belt-analyzer-slot=__plural_for_parameter__1__{1=first|2=second|3=third|4=fourth}__ slot
ui-belt-analyzer-empty=empty

# When neither lane carries anything.
ui-belt-analyzer-no-contents=Nothing on this belt

ui-belt-analyzer-aggregation=__1__, __2__ percent of the belt
